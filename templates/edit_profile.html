<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit My Profile | EduTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- ======================
            SIDEBAR
    ======================= -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="{{ url_for('static', filename='images/edutrack-logo.png') }}"
                 alt="EduTrack Logo">

        </div>

        <ul class="sidebar-menu">

            <li>
                <a href="{{ url_for('learner_dashboard') }}">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{{ url_for('learner_courses') }}">
                    <i class="fa-solid fa-book-open"></i>
                    Explore Courses
                </a>
            </li>

            <li>
                <a href="{{ url_for('learner_progress') }}">
                    <i class="fa-solid fa-chart-line"></i>
                    My Progress
                </a>
            </li>

            <li>
                <a href="{{ url_for('learner_certificates') }}">
                    <i class="fa-solid fa-award"></i>
                    Certificates
                </a>
            </li>

            <li class="active">
                <a href="{{ url_for('learner_profile') }}">
                    <i class="fa-solid fa-user"></i>
                    My Profile
                </a>
            </li>

            <li>
                <a href="{{ url_for('learner_logout') }}">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- ======================
        MAIN CONTENT
    ======================= -->

    <main class="dashboard-content">

        <section class="page-header">

            <h1>👤 Edit My Profile</h1>

            <p>

                Update your personal information below.

            </p>

        </section>

        <section class="profile-card">

            <form method="POST">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="learner_name"
                        value="{{ learner['name'] }}"
                        required>

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        name="learner_email"
                        value="{{ learner['email'] }}"
                        required>

                </div>

                <div class="form-group">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="learner_dob"
                        value="{{ learner['date_of_birth'] }}"
                        required>

                </div>

                <div class="form-group">

                    <label>Skill</label>

                    <input
                        type="text"
                        value="{{ learner['skill'] }}"
                        disabled>

                </div>

                <div class="form-group">

                    <label>Level</label>

                    <input
                        type="text"
                        value="{{ learner['level'] }}"
                        disabled>

                </div>

                <div class="edit-buttons">

                    <button
                        type="submit"
                        class="save-btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Changes

                    </button>

                    <a href="{{ url_for('learner_profile') }}"
                       class="cancel-btn">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back

                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

</body>

</html>
