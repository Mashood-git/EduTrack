<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Certificates | EduTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- ======================
            SIDEBAR
    ======================= -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="{{ url_for('static',
                     filename='images/edutrack-logo.png') }}"
                 alt="EduTrack Logo">

        </div>

        <ul class="sidebar-menu">

            <li>

                <a href="{{ url_for('learner_dashboard') }}">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="{{ url_for('learner_courses') }}">

                    <i class="fa-solid fa-book-open"></i>

                    Explore Courses

                </a>

            </li>

            <li>

                <a href="{{ url_for('learner_progress') }}">

                    <i class="fa-solid fa-chart-line"></i>

                    My Progress

                </a>

            </li>

            <li class="active">

                <a href="{{ url_for('learner_certificates') }}">

                    <i class="fa-solid fa-award"></i>

                    Certificates

                </a>

            </li>

            <li>

                <a href="{{ url_for('learner_profile') }}">

                    <i class="fa-solid fa-user"></i>

                    My Profile

                </a>

            </li>

            <li>

                <a href="{{ url_for('logout') }}">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- ======================
            MAIN CONTENT
    ======================= -->

    <main class="dashboard-content">

        <!-- Page Header -->

        <section class="page-header">

            <h1>🏆 My Certificates</h1>

            <p>

                View and download certificates earned after completing courses.

            </p>

        </section>

        <!-- Empty Certificate -->

        <section class="certificate-container">

            <div class="certificate-card">

                <i class="fa-solid fa-award certificate-icon"></i>

                <h2>No Certificates Yet</h2>

                <p>

                    Complete a course and pass the quiz to unlock your first certificate.

                </p>

                <a href="{{ url_for('learner_courses') }}"
                   class="continue-btn">

                    Explore Courses

                </a>

            </div>

        </section>

    </main>

</div>

</body>

</html>
