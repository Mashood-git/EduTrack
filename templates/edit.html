<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack | Edit Learner</title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- ================= BRAND ================= -->

    <div class="logo-container register-logo">

        <img src="{{ url_for('static', filename='images/edutrack-logo.png') }}"
             class="logo"
             alt="EduTrack Logo">

    </div>

    <!-- ================= PAGE TITLE ================= -->

    <section class="page-title">

        <h2>

            <i class="fa-solid fa-user-pen"></i>

            Edit Learner

        </h2>

        <p>

            Update learner information and keep their learning profile
            accurate and up to date.

        </p>

    </section>

    <!-- ================= FORM ================= -->

    <section class="form-container">

        <form action="{{ url_for('edit_learner', id=learner['id']) }}"
              method="POST">

            <!-- Full Name -->

            <label for="learner_name">

                <i class="fa-solid fa-user"></i>

                Full Name

            </label>

            <input
                type="text"
                id="learner_name"
                name="learner_name"
                value="{{ learner['name'] }}"
                maxlength="100"
                autocomplete="name"
                required>

            <!-- Email -->

            <label for="learner_email">

                <i class="fa-solid fa-envelope"></i>

                Email Address

            </label>

            <input
                type="email"
                id="learner_email"
                name="learner_email"
                value="{{ learner['email'] }}"
                autocomplete="email"
                required>

            <!-- Date of Birth -->

            <label for="learner_dob">

                <i class="fa-solid fa-calendar-days"></i>

                Date of Birth

            </label>

            <input
                type="date"
                id="learner_dob"
                name="learner_dob"
                value="{{ learner['date_of_birth'] }}"
                required>

            <!-- Learning Path -->

            <label for="learner_skill">

                <i class="fa-solid fa-book-open"></i>

                Learning Path

            </label>

            <select
                id="learner_skill"
                name="learner_skill"
                required>

                <option value="Python" {% if learner["skill"] == "Python" %}selected{% endif %}>Python</option>

                <option value="Java" {% if learner["skill"] == "Java" %}selected{% endif %}>Java</option>

                <option value="Full Stack Web Development" {% if learner["skill"] == "Full Stack Web Development" %}selected{% endif %}>
                    Full Stack Web Development
                </option>

                <option value="AI & Machine Learning" {% if learner["skill"] == "AI & Machine Learning" %}selected{% endif %}>
                    AI & Machine Learning
                </option>

                <option value="AWS Cloud" {% if learner["skill"] == "AWS Cloud" %}selected{% endif %}>
                    AWS Cloud
                </option>

                <option value="SQL & Databases" {% if learner["skill"] == "SQL & Databases" %}selected{% endif %}>
                    SQL & Databases
                </option>

                <option value="Data Science" {% if learner["skill"] == "Data Science" %}selected{% endif %}>
                    Data Science
                </option>

                <option value="Cyber Security" {% if learner["skill"] == "Cyber Security" %}selected{% endif %}>
                    Cyber Security
                </option>

            </select>

            <!-- Level -->

            <label for="learner_level">

                <i class="fa-solid fa-chart-line"></i>

                Skill Level

            </label>

            <select
                id="learner_level"
                name="learner_level"
                required>

                <option value="Beginner" {% if learner["level"] == "Beginner" %}selected{% endif %}>Beginner</option>

                <option value="Intermediate" {% if learner["level"] == "Intermediate" %}selected{% endif %}>Intermediate</option>

                <option value="Advanced" {% if learner["level"] == "Advanced" %}selected{% endif %}>Advanced</option>

            </select>

            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="submit"
                    class="update-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Learner

                </button>

                <a href="{{ url_for('home') }}"
                   class="outline-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Dashboard

                </a>

            </div>

        </form>

    </section>

</div>

<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>

        © 2026 <strong>EduTrack</strong>

        <br>

        AI-Powered Learning Platform

        <br><br>

        Developed by <strong>Mashood Ahmed Shariff</strong>

    </p>

</footer>

</body>
</html>
